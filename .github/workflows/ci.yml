name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Syntax gate for the shell scripts (bash -n, parse-only) plus several
  # small, hermetic Python/shell checks: py_compile for install.py,
  # legacy/provision_legacy.py, profile/profile.py and tools/dotfiles.py;
  # profile/test_profile.py + profile/test_profile.sh (the profile-contract
  # reader's own corpus, both implementations -- was never wired into CI
  # before #40, a pre-existing gap closed here rather than left for later);
  # tests/test_install_ai_gate.py, which actually RUNS install.py (for real,
  # against a throwaway scratch copy -- see that file's docstring) to
  # regression-test the AI-profile gate's tri-state (invalid profile =
  # leave-alone, not a silent unlink) fixed as part of PR #64's security
  # review; tests/test_dotfiles_cli.py, which does the same for the
  # `dotfiles profile` CLI added in #40 (tools/dotfiles.py) -- invalid-name
  # rejection, the ancestor-symlink warn+skip, atomic write, --dry-run, and
  # the Ansible hand-off, all against real subprocess runs in a sandbox
  # $HOME, never mocked; and tests/test_hookspath_repo_guard.py, which
  # regression-tests issue #70 (install.py could repoint another
  # repository's core.hooksPath -- a copy nested in an outer repo, a leaked
  # GIT_DIR, or a linked worktree sharing a primary checkout's .git/config)
  # and demonstrates, via `git archive main`, that the vulnerable behaviour
  # is real on main and fixed on this branch.
  shell-python-syntax:
    name: shell-python-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: python -m py_compile install.py roster/*.py
        run: python3 -m py_compile install.py roster/render.py roster/targets.py

      - name: python -m py_compile legacy/provision_legacy.py
        run: python3 -m py_compile legacy/provision_legacy.py

      - name: python -m py_compile profile/profile.py
        run: python3 -m py_compile profile/profile.py

      - name: python -m py_compile tools/dotfiles.py
        run: python3 -m py_compile tools/dotfiles.py

      - name: python3 profile/test_profile.py (profile contract, Python reader)
        run: python3 profile/test_profile.py -v

      - name: bash profile/test_profile.sh (profile contract, shell reader)
        run: bash profile/test_profile.sh

      - name: python3 tests/test_install_ai_gate.py (AI-gate tri-state regression)
        run: python3 tests/test_install_ai_gate.py -v

      - name: python3 tests/test_dotfiles_cli.py (dotfiles profile CLI)
        run: python3 tests/test_dotfiles_cli.py -v

      - name: python3 tests/test_hookspath_repo_guard.py (issue #70 core.hooksPath repo guard)
        run: python3 tests/test_hookspath_repo_guard.py -v

      - name: bash -n on every tracked shell script
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if bash -n "$f"; then
              echo "ok    $f"
            else
              echo "FAIL  $f"
              status=1
            fi
          done < <(
            git ls-files \
              '*.sh' \
              'hooks/pre-commit' \
              'hooks/post-checkout' \
              'hooks/post-merge' \
              'hooks/post-rewrite'
          )
          exit "$status"

  # Invariant gate: this job name is a required status check under branch
  # protection, so it keeps its old name (`agent-spine-drift`) even though
  # spine-comparison-by-marker is gone — renaming it would block every PR
  # until someone updated the branch-protection setting by hand.
  #
  # Two independent checks now live here:
  #   - `make roster-check` (roster/render.py --check) regenerates every
  #     agent-definition file from roster/templates/*.md.j2 and diffs
  #     against what's committed. This is what "spine drift" means today:
  #     not two hand-maintained copies disagreeing, but a generated file
  #     that no longer matches its own template.
  #   - hooks/pre-commit, which still carries the ABSOLUTE RULE (never-merge)
  #     invariant check, independent of generation (see that file's header
  #     for why). It reads the git index via `git show :<path>`, which on a
  #     fresh checkout is identical to HEAD, so the hook runs unmodified here
  #     with no staging step.
  agent-spine-drift:
    name: agent-spine-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: pip install -r roster/requirements.txt
        run: pip install -r roster/requirements.txt

      - name: make roster-check (regenerated roster matches committed files)
        run: make roster-check

      - name: hooks/pre-commit (never-merge invariant)
        run: |
          bash hooks/pre-commit
          echo "hooks/pre-commit passed: never-merge invariant intact"

  # Lint gate, scoped to the operational core: the installer entrypoints, the
  # git-hook machinery, the tools/ scripts, and the Claude hook scripts.
  # severity=warning so style-only info notes do not gate merges. The rc
  # fragments under shell/ and the platform helpers under git/, wsl/, macos/
  # and secrets/ are deliberately out of scope here (see PR description).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck --severity=warning (operational core)
        run: |
          shellcheck --version
          shellcheck --severity=warning --external-sources \
            install.sh \
            bootstrap/bootstrap.sh \
            hooks/pre-commit \
            hooks/_dispatch.sh \
            tools/smart-editor.sh \
            tools/start-project.sh \
            claude/hooks/block-ai-attribution.sh \
            claude/hooks/block-pr-merge.sh \
            claude/hooks/require-devcontainer.sh
