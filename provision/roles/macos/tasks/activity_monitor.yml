---
# ── Activity Monitor ──────────────────────────────────────────────────────────
# macos/defaults.sh lines:
#   defaults write com.apple.ActivityMonitor OpenMainWindow    -bool true
#   defaults write com.apple.ActivityMonitor ShowCategory      -int 0
#
# Not restarted in the original script; takes effect the next time Activity
# Monitor launches.

- name: Open the main window when Activity Monitor launches
  community.general.osx_defaults:
    domain: com.apple.ActivityMonitor
    key: OpenMainWindow
    type: bool
    value: true

- name: Show all processes in Activity Monitor
  community.general.osx_defaults:
    domain: com.apple.ActivityMonitor
    key: ShowCategory
    type: int
    value: 0
