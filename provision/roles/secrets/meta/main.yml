---
galaxy_info:
  role_name: secrets
  namespace: dotfiles
  author: dotfiles maintainers
  description: >-
    Seed CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN, the git identity and (when
    configured) the OpenRouter API key into the OS-native git credential
    store under the same synthetic hosts secrets/README.md documents, so the
    existing shell-rc readers (shell/exports.sh) and devcontainer credential
    forwarding keep working unchanged.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: [all]
    - name: Debian
      versions: [all]
    - name: MacOSX
      versions: [all]

# Only ansible.builtin modules are used (command, set_fact, stat, fail,
# include_tasks/import_tasks) -- no extra collection dependency, unlike
# roles/packages (which needs community.general for the homebrew* modules).
collections: []

dependencies: []
