---
# provision/roles/secrets -- seeds CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN, the git
# identity and (when configured) the OpenRouter API key into the OS-native
# git credential store under the synthetic hosts secrets/README.md documents,
# so the existing shell-rc readers (shell/exports.sh) and devcontainer
# credential forwarding keep working unchanged. See README.md for the
# vault-vs-env-var-lookup decision and the retirement mapping back to
# legacy/provision_legacy.py.
#
# HARD REQUIREMENT: every task that can touch a real secret (`git credential
# approve`/`fill`, `gh auth token`) lives inside a `block:` gated
# `when: not ansible_check_mode`, so --check is safe BY CONSTRUCTION, not by
# convention (changed_when is not relied on for this). The two context-
# detection tasks below (stat a file, check an executable is on PATH) are
# read-only, touch no secret material, and never write anything, so they run
# unconditionally -- the facts they set feed the `when:` on every block
# below, including in check mode, so `--check --diff` still reports
# accurately what WOULD happen without ever doing it.

- name: Stat /.dockerenv (devcontainer detection, matches legacy is_devcontainer())
  ansible.builtin.stat:
    path: /.dockerenv
  register: _secrets_dockerenv
  tags: [always]

- name: Record devcontainer / OS-family context facts (internal -- not this role's variable API)
  # Underscore-prefixed and read directly by the `when:` gates in
  # git_identity.yml / gh_token.yml -- deliberately NOT named
  # secrets_is_devcontainer / secrets_is_windows. Extra-vars (`-e`) take
  # precedence over set_fact for ANY variable name, so a public,
  # documented-sounding name here would let `-e secrets_is_devcontainer=false`
  # silently defeat the devcontainer skip-gate and persist a forwarded
  # GH_TOKEN / the git identity into a devcontainer's own on-disk credential
  # store. The only supported, documented way to force the gate open is
  # `secrets_force_seed_in_devcontainer` (see defaults/main.yml) -- test/CI
  # only, never for a real devcontainer.
  ansible.builtin.set_fact:
    _secrets_detected_devcontainer: >-
      {{ (lookup('ansible.builtin.env', 'REMOTE_CONTAINERS') | length > 0)
         or (lookup('ansible.builtin.env', 'CODESPACES') | length > 0)
         or (lookup('ansible.builtin.env', 'DEVCONTAINER') | length > 0)
         or _secrets_dockerenv.stat.exists }}
    _secrets_detected_windows: "{{ ansible_facts['os_family'] == 'Windows' }}"
  tags: [always]

- name: Warn loudly when the devcontainer skip-gate is being forced open
  ansible.builtin.debug:
    msg: >-
      secrets_force_seed_in_devcontainer=true and a devcontainer was
      detected -- forcing the git-identity / GH_TOKEN devcontainer skip-gate
      open anyway. This will seed credentials into THIS devcontainer's own
      on-disk credential store. This escape hatch is for test/CI harnesses
      only; never set it against a real devcontainer. See README.md.
  when:
    - _secrets_detected_devcontainer | bool
    - secrets_force_seed_in_devcontainer | bool
  tags: [always]

- name: Check whether git is on PATH (hard prerequisite for every secret in this role)
  ansible.builtin.command:
    cmd: which git
  register: _secrets_which_git
  changed_when: false
  failed_when: false
  tags: [always]

- name: Record whether git is available
  ansible.builtin.set_fact:
    secrets_git_present: "{{ _secrets_which_git.rc == 0 }}"
  tags: [always]

- name: Seed the git identity into the credential store
  ansible.builtin.import_tasks: git_identity.yml
  when:
    - secrets_seed_identity | bool
    - secrets_git_present | bool
  tags: [secrets, secrets_identity]

- name: Seed GH_TOKEN into the credential store
  ansible.builtin.import_tasks: gh_token.yml
  when:
    - secrets_seed_gh_token | bool
    - secrets_git_present | bool
  tags: [secrets, secrets_gh]

- name: Seed CLAUDE_CODE_OAUTH_TOKEN into the credential store
  ansible.builtin.import_tasks: claude_token.yml
  when:
    - secrets_seed_claude_token | bool
    - secrets_git_present | bool
  tags: [secrets, secrets_claude]

- name: Seed OPENROUTER_API_KEY into the credential store
  ansible.builtin.import_tasks: openrouter_key.yml
  when:
    - secrets_seed_openrouter_key | bool
    - secrets_git_present | bool
  tags: [secrets, secrets_openrouter]

- name: Warn (non-fatal) when git is missing entirely
  ansible.builtin.debug:
    msg: >-
      git not found on PATH -- every secret-store task in this role was
      skipped. Install git first (see provision/roles/packages).
  when: not (secrets_git_present | bool)
  tags: [always]
