---
# Shared store/compare/verify logic, included via `include_tasks` with
# call-site vars:
#   _secrets_cred_host     -- the synthetic host (e.g. dotfiles-secrets.local)
#   _secrets_cred_username -- the credential username field
#   _secrets_cred_password -- the secret value to store
#   _secrets_cred_label    -- human-readable label for task names/messages
#
# Callers gate the include itself behind `when: not ansible_check_mode` (see
# tasks/main.yml's module docstring), so the `git credential fill`/`approve`
# calls in this file never run in check mode -- by construction. Every task
# here carries `no_log: true` because `_secrets_cred_password` (and the fill
# readback) is live secret material, and the secret is passed via `stdin`,
# never as a command-line argument -- it never appears in argv, so it never
# appears in a process listing either.
#
# Idempotent by design: it reads the currently stored value first and only
# calls `credential approve` when it differs from the desired value, so a
# second run against an already-seeded host reports no change (matching a
# real Ansible idempotency check), rather than unconditionally overwriting on
# every run.

- name: "Read the currently stored value (for idempotency) -- {{ _secrets_cred_label }}"
  ansible.builtin.command: # noqa: command-instead-of-module -- ansible.builtin.git only manages repo checkouts, not `git credential`
    cmd: git -c credential.interactive=never credential fill
    stdin: "protocol=https\nhost={{ _secrets_cred_host }}\nusername={{ _secrets_cred_username }}\n"
  register: _secrets_cred_fill
  changed_when: false
  failed_when: false
  no_log: true
  environment:
    GCM_INTERACTIVE: "never"
    GCM_NO_UI: "true"

- name: "Extract the currently stored password field -- {{ _secrets_cred_label }}"
  ansible.builtin.set_fact:
    _secrets_cred_current: "{{ _secrets_cred_fill.stdout | default('') | regex_findall('^password=(.*)$', multiline=True) | first | default('') }}"
  no_log: true

- name: "Store into the credential store -- {{ _secrets_cred_label }}"
  ansible.builtin.command: # noqa: command-instead-of-module -- ansible.builtin.git only manages repo checkouts, not `git credential`
    cmd: git -c credential.interactive=never credential approve
    stdin: "protocol=https\nhost={{ _secrets_cred_host }}\nusername={{ _secrets_cred_username }}\npassword={{ _secrets_cred_password }}\n"
  when: _secrets_cred_current != _secrets_cred_password
  changed_when: true
  no_log: true
  environment:
    GCM_INTERACTIVE: "never"
    GCM_NO_UI: "true"

- name: "Verify the stored value reads back correctly -- {{ _secrets_cred_label }}"
  ansible.builtin.command: # noqa: command-instead-of-module -- ansible.builtin.git only manages repo checkouts, not `git credential`
    cmd: git -c credential.interactive=never credential fill
    stdin: "protocol=https\nhost={{ _secrets_cred_host }}\nusername={{ _secrets_cred_username }}\n"
  register: _secrets_cred_verify
  changed_when: false
  failed_when: false
  no_log: true
  when: _secrets_cred_current != _secrets_cred_password
  environment:
    GCM_INTERACTIVE: "never"
    GCM_NO_UI: "true"

# `credential approve` reports success even when nothing was actually
# persisted (e.g. no credential.helper configured, or a broken one) --
# confirmed in legacy/provision_legacy.py's own comment, it exits 0
# regardless. Read it straight back before trusting it worked, exactly like
# secrets/setup-claude-token.sh and legacy/provision_legacy.py already do.
- name: "Fail loudly if the store didn't actually persist the value -- {{ _secrets_cred_label }}"
  ansible.builtin.fail:
    msg: >-
      {{ _secrets_cred_label }} was written to the credential store (host=
      {{ _secrets_cred_host }}) but reading it back did not return the same value --
      something is wrong with credential.helper. Run
      'git config --get credential.helper' to check. See secrets/README.md.
  when:
    - _secrets_cred_current != _secrets_cred_password
    - (_secrets_cred_verify.stdout | default('') | regex_findall('^password=(.*)$', multiline=True) | first | default('')) != _secrets_cred_password
  no_log: true
