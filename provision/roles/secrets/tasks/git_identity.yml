---
# Retires: legacy/provision_legacy.py's "git identity credential-store
# seeding" section (tagged `Retires with: #44`). Mirrors it exactly: reads
# the ALREADY-CONFIGURED git identity out of ~/.gitconfig -- there is no
# external secret input here, nothing to vault -- and re-stores it under the
# synthetic `dotfiles-identity.local` host so devcontainer credential
# forwarding can hand it back to install.py's identity carry-forward READ
# (install.py's git section), which this role does not touch.
#
# Same platform gate as legacy: skipped inside a devcontainer (nothing to
# seed FROM there) and on Windows (GCM handles devcontainer forwarding
# natively there and shows interactive dialogs for unrecognised hosts
# regardless of env flags -- see legacy/provision_legacy.py's comment).
- name: Seed the git identity into the credential store (devcontainer carry-forward)
  when: not ansible_check_mode
  no_log: true
  block:
    - name: Read the effective git user.name from ~/.gitconfig
      ansible.builtin.command: # noqa: command-instead-of-module -- ansible.builtin.git only manages repo checkouts, not `git config`
        cmd: git config --file {{ ansible_user_dir }}/.gitconfig --get user.name
      register: _secrets_git_name
      changed_when: false
      failed_when: false
      no_log: false # a git identity is not secret material -- every commit already carries it

    - name: Read the effective git user.email from ~/.gitconfig
      ansible.builtin.command: # noqa: command-instead-of-module -- ansible.builtin.git only manages repo checkouts, not `git config`
        cmd: git config --file {{ ansible_user_dir }}/.gitconfig --get user.email
      register: _secrets_git_email
      changed_when: false
      failed_when: false
      no_log: false

    - name: Store the git identity under the synthetic devcontainer-forwarding host
      ansible.builtin.include_tasks: _store_credential.yml
      when:
        - (_secrets_git_name.stdout | default('') | trim) != ''
        - (_secrets_git_email.stdout | default('') | trim) != ''
        - not (secrets_is_devcontainer | bool)
        - not (secrets_is_windows | bool)
      vars:
        _cred_host: "{{ secrets_identity_host }}"
        _cred_username: "{{ _secrets_git_name.stdout | trim }}"
        _cred_password: "{{ _secrets_git_email.stdout | trim }}"
        _cred_label: "git identity"
