---
# New automation path -- legacy/provision_legacy.py does NOT seed this value
# itself; only secrets/setup-claude-token.sh does, interactively (see
# README.md, "What this role does that legacy did not"). This task seeds
# CLAUDE_CODE_OAUTH_TOKEN under the exact same synthetic host
# (`dotfiles-secrets.local`) and username (`claude-code`) that
# setup-claude-token.sh uses, so shell/exports.sh and devcontainer forwarding
# cannot tell the difference between the two paths.
#
# The token value itself comes ONLY from the operator's environment
# (CLAUDE_CODE_OAUTH_TOKEN, e.g. already produced by `claude setup-token` and
# handed to this role instead of the interactive script) -- never vaulted,
# never hardcoded. See README.md, "Vault vs. env-var lookup".
- name: Seed CLAUDE_CODE_OAUTH_TOKEN into the credential store
  when:
    - not ansible_check_mode
    - (secrets_claude_code_oauth_token | default('') | trim | length) > 0
  no_log: true
  block:
    - name: Store CLAUDE_CODE_OAUTH_TOKEN under the synthetic secrets host
      ansible.builtin.include_tasks: _store_credential.yml
      vars:
        _secrets_cred_host: "{{ secrets_claude_host }}"
        _secrets_cred_username: "claude-code"
        _secrets_cred_password: "{{ secrets_claude_code_oauth_token | trim }}"
        _secrets_cred_label: "Claude Code OAuth token"
        _secrets_cred_sentinel: "{{ secrets_claude_sentinel }}"
