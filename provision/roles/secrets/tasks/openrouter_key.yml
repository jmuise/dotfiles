---
# New automation path -- legacy/provision_legacy.py does NOT seed this value
# either; only secrets/setup-openrouter-key.sh does, interactively (see
# README.md). Seeds OPENROUTER_API_KEY under the exact same synthetic host
# (`dotfiles-openrouter.local`) and username (`openrouter`) that
# setup-openrouter-key.sh uses, so shell/exports.sh cannot tell the
# difference between the two paths.
#
# The key value comes ONLY from the operator's environment
# (OPENROUTER_API_KEY) -- never vaulted, never hardcoded. See README.md,
# "Vault vs. env-var lookup".
- name: Seed OPENROUTER_API_KEY into the credential store
  when:
    - not ansible_check_mode
    - (secrets_openrouter_api_key | default('') | trim | length) > 0
  no_log: true
  block:
    - name: Store OPENROUTER_API_KEY under the synthetic OpenRouter host
      ansible.builtin.include_tasks: _store_credential.yml
      vars:
        _secrets_cred_host: "{{ secrets_openrouter_host }}"
        _secrets_cred_username: "openrouter"
        _secrets_cred_password: "{{ secrets_openrouter_api_key | trim }}"
        _secrets_cred_label: "OpenRouter API key"
