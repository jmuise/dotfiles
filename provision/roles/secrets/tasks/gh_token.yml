---
# Retires: legacy/provision_legacy.py's "git credential-store seeding" gh
# OAuth token block (tagged `Retires with: #44`). Mirrors it exactly: derives
# the token from the host's ALREADY-authenticated `gh` CLI session (no
# external secret input needed for the common case) and re-stores it under
# the synthetic `dotfiles-gh.local` host. `secrets_gh_token_override` is an
# escape hatch for a box where `gh` isn't authenticated locally but a token
# is available from elsewhere -- see README.md.
#
# Same platform gate as legacy: skipped inside a devcontainer and on
# Windows -- see git_identity.yml for why.
- name: Seed GH_TOKEN into the credential store
  when:
    - not ansible_check_mode
    - not (secrets_is_devcontainer | bool)
    - not (secrets_is_windows | bool)
  no_log: true
  block:
    - name: Check whether the gh CLI is on PATH
      ansible.builtin.command:
        cmd: which gh
      register: _secrets_gh_which
      changed_when: false
      failed_when: false
      no_log: false # a PATH check is not secret material

    - name: Obtain the gh OAuth token from gh's own persisted session
      ansible.builtin.command:
        cmd: gh auth token
      register: _secrets_gh_auth_token
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - _secrets_gh_which.rc == 0
        - (secrets_gh_token_override | default('') | length) == 0

    - name: Determine the effective gh token to store
      ansible.builtin.set_fact:
        _secrets_gh_effective_token: >-
          {{ (secrets_gh_token_override
              if (secrets_gh_token_override | default('') | length) > 0
              else (_secrets_gh_auth_token.stdout | default(''))) | trim }}
      no_log: true

    - name: Store GH_TOKEN under the synthetic devcontainer-forwarding host
      ansible.builtin.include_tasks: _store_credential.yml
      when: (_secrets_gh_effective_token | default('') | length) > 0
      vars:
        _secrets_cred_host: "{{ secrets_gh_host }}"
        _secrets_cred_username: "gh-cli"
        _secrets_cred_password: "{{ _secrets_gh_effective_token }}"
        _secrets_cred_label: "gh OAuth token"
        _secrets_cred_sentinel: "{{ secrets_gh_sentinel }}"
