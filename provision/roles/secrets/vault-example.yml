---
# EXAMPLE ONLY -- placeholder values, never a real secret. Not loaded by
# site.yml or this role's defaults; nothing here is consumed automatically.
#
# This role's default input mechanism is env-var lookup, not ansible-vault --
# see README.md ("Vault vs. env-var lookup") for the full justification. If
# you'd still rather feed these variables from an encrypted vars file (e.g.
# because your invocation environment can't safely hold plaintext env vars,
# or you want the value versioned-and-encrypted per-host in your own private
# inventory), this is the shape to encrypt:
#
#   ansible-vault encrypt_string --stdin-name secrets_claude_code_oauth_token
#   ansible-vault encrypt_string --stdin-name secrets_openrouter_api_key
#   ansible-vault encrypt_string --stdin-name secrets_gh_token_override
#
# ...and place the resulting `!vault |` blocks in your OWN untracked
# group_vars/host_vars file (or pass -e @path/to/vault.yml
# --ask-vault-pass). Never commit the encrypted result to this repo --
# secrets/README.md's "no tokens are ever written into this repo" invariant
# applies to an encrypted copy too, not just plaintext.
secrets_claude_code_oauth_token: "REPLACE_ME_sk-ant-oat01-example-placeholder"
secrets_openrouter_api_key: "REPLACE_ME_sk-or-v1-example-placeholder"
secrets_gh_token_override: "REPLACE_ME_ghp_example-placeholder"
