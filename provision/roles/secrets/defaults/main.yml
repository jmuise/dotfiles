---
# ── Synthetic credential-store hosts ─────────────────────────────────────────
# Must match git/.gitconfig.template's `[credential "https://<host>"]` blocks
# and secrets/README.md exactly -- these are the hosts shell/exports.sh and
# devcontainer credential forwarding read from. Do not rename these without
# updating all three places.
secrets_identity_host: dotfiles-identity.local
secrets_gh_host: dotfiles-gh.local
secrets_claude_host: dotfiles-secrets.local
secrets_openrouter_host: dotfiles-openrouter.local

# ── Secret VALUES ────────────────────────────────────────────────────────────
# Sourced from the invoking operator's environment at playbook-run time --
# never hardcoded here, never committed, never held in an ansible-vault file.
# See README.md ("Vault vs. env-var lookup") for why.
#
# CLAUDE_CODE_OAUTH_TOKEN: the long-lived token `claude setup-token` prints
# (same value secrets/setup-claude-token.sh asks you to paste). Leave unset to
# skip seeding it via this role -- e.g. when you'd rather keep running the
# interactive script by hand.
secrets_claude_code_oauth_token: "{{ lookup('ansible.builtin.env', 'CLAUDE_CODE_OAUTH_TOKEN') }}"

# OPENROUTER_API_KEY: the dashboard-issued key (same value
# secrets/setup-openrouter-key.sh asks you to paste). Leave unset to skip.
secrets_openrouter_api_key: "{{ lookup('ansible.builtin.env', 'OPENROUTER_API_KEY') }}"

# GH_TOKEN is normally DERIVED by this role via `gh auth token`, mirroring
# legacy/provision_legacy.py exactly -- no secret input required for the
# common case where `gh auth login` has already been run on this box. This
# var is only an escape hatch for a box where gh isn't authenticated locally
# but a token is available from elsewhere (e.g. minted for CI); leave unset
# for the normal path.
secrets_gh_token_override: "{{ lookup('ansible.builtin.env', 'GH_TOKEN') }}"

# ── Sentinel files ───────────────────────────────────────────────────────────
# Mirrors secrets/setup-claude-token.sh / setup-openrouter-key.sh /
# legacy/provision_legacy.py's devcontainer-extras section EXACTLY:
# shell/exports.sh only attempts a credential-store lookup once one of these
# sentinel files exists (a lookup against an unconfigured host is not a fast
# no-op -- GCM network-probes it first, adding real seconds to shell
# startup). This role touches the matching sentinel once it has verified the
# value is correctly in the store, so a machine provisioned ONLY via this
# role (never having run the interactive scripts) still gets picked up by
# shell/exports.sh on the very next new shell.
secrets_cache_dir: "{{ (lookup('ansible.builtin.env', 'XDG_CACHE_HOME') | default(ansible_user_dir + '/.cache', true)) }}/dotfiles"
secrets_claude_sentinel: "{{ secrets_cache_dir }}/claude-token.configured"
secrets_openrouter_sentinel: "{{ secrets_cache_dir }}/openrouter-token.configured"
secrets_gh_sentinel: "{{ secrets_cache_dir }}/gh-token.configured"

# ── Per-secret toggles ───────────────────────────────────────────────────────
# All default on; each is independently skippable (e.g. -e
# secrets_seed_claude_token=false) without touching the others.
secrets_seed_identity: true
secrets_seed_gh_token: true
secrets_seed_claude_token: true
secrets_seed_openrouter_key: true
