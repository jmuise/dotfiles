---
# Dispatch on OS family. Each branch reads the matching manifest from the repo
# root; none of them re-list packages here.
#
# Tags (added for #40's `dotfiles profile <name>` CLI, which re-runs this
# play scoped to `--tags ai_clis` after a profile switch): a switch between
# bare/inline/agentic only ever changes want_ai_clis, never the OS package
# manifests, so re-running the whole apt/brew sweep on every profile switch
# would be slow and need sudo for no reason. `ai_clis` isolates exactly the
# task that IS profile-gated; `packages` tags the role's OS-package tasks for
# symmetry / a normal full run. Role behaviour is otherwise unchanged --
# these are additive tags, no `when:` conditions moved or altered.

- name: Install apt packages (Debian / Ubuntu / WSL)
  ansible.builtin.import_tasks: apt.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [packages]

# #67: apt doesn't ship git-delta on bookworm. Runs right after apt.yml,
# which sets packages_delta_apt_available from its availability probe. Also
# covers the #41-tagged "ensure-delta.sh" portion of legacy's devcontainer
# extras -- see tasks/delta.yml's header comment.
- name: Ensure git-delta is available even when apt doesn't ship it (#67)
  ansible.builtin.import_tasks: delta.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [packages]

# Debian-family binary installs not covered by apt.txt (#41). macOS gets the
# same four tools from the Brewfile instead -- see tasks/homebrew.yml.
- name: Install starship (Debian family; macOS via Brewfile)
  ansible.builtin.import_tasks: starship.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [packages]

- name: Install neovim (Debian family; macOS via Brewfile)
  ansible.builtin.import_tasks: neovim.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [packages]

- name: Install lazygit (Debian family; macOS via Brewfile)
  ansible.builtin.import_tasks: lazygit.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [packages]

- name: Install yazi (Debian family; macOS via Brewfile)
  ansible.builtin.import_tasks: yazi.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: [packages]

# Dev tooling, not an AI CLI -- not profile-gated (#41). Not installed on
# native Windows (forwarded into WSL instead; see tasks/devcontainer_cli.yml).
- name: Install the devcontainer CLI
  ansible.builtin.import_tasks: devcontainer_cli.yml
  when: ansible_facts['os_family'] != 'Windows'
  tags: [packages]

- name: Install Homebrew packages (macOS)
  ansible.builtin.import_tasks: homebrew.yml
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [packages]

# Windows: winget (system-level) + Scoop (developer tools), #41. See
# tasks/windows.yml's header -- UNVERIFIED, no Windows host reachable.
- name: Install Windows packages (winget + Scoop)
  ansible.builtin.import_tasks: windows.yml
  when: ansible_facts['os_family'] == 'Windows'
  tags: [packages]

- name: Install profile-gated AI CLIs
  ansible.builtin.import_tasks: ai_clis.yml
  when: want_ai_clis | bool
  tags: [packages, ai_clis]
