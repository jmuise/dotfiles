---
# Retires the binary-install portion of legacy/provision_legacy.py's "yazi"
# section (#41). The config symlink itself stays in install.py/dotfiles
# linking -- out of scope for this role. Debian-family only -- macOS gets
# yazi from the Brewfile (see tasks/homebrew.yml).
#
# Version is unpinned upstream (always the latest GitHub release), same as
# legacy; only installed when absent -- the same gate legacy used. Note
# yazi's release-archive architecture label differs from neovim/lazygit's
# ("aarch64", not "arm64") -- mirrored here verbatim from legacy, not
# normalized, per "move, don't improve".

- name: Check whether yazi is already on PATH
  ansible.builtin.command: sh -c 'command -v yazi'
  environment:
    PATH: "{{ packages_search_path }}"
  register: _packages_yazi_present
  changed_when: false
  failed_when: false
  check_mode: false

# Skipped outright under --check: ansible.builtin.tempfile and
# ansible.builtin.unarchive both only partially support check mode (see
# neovim.yml's comment on the same pattern), so the whole install is gated
# on `not ansible_check_mode` and previewed with an explicit debug task
# instead -- the honest equivalent of legacy's own `if DRY_RUN: print(...)`
# branch for this same install.
- name: Preview the yazi install (check mode)
  ansible.builtin.debug:
    msg: "would install yazi to ~/.local/bin (GitHub releases zip)"
  when:
    - _packages_yazi_present.rc != 0
    - ansible_check_mode

- name: Install yazi (latest GitHub release, unpinned upstream)
  when:
    - _packages_yazi_present.rc != 0
    - not ansible_check_mode
  block:
    - name: Map machine architecture to yazi's release naming scheme
      ansible.builtin.set_fact:
        _packages_yazi_arch: "{{ 'x86_64' if ansible_facts['architecture'] == 'x86_64' else 'aarch64' }}"

    - name: Create a temp file for the yazi download
      ansible.builtin.tempfile:
        state: file
        suffix: yazi.zip
      register: _packages_yazi_tmp

    - name: Download the yazi release zip
      ansible.builtin.get_url:
        url: "https://github.com/sxyazi/yazi/releases/latest/download/yazi-{{ _packages_yazi_arch }}-unknown-linux-musl.zip"
        dest: "{{ _packages_yazi_tmp.path }}"
        mode: "0644"
        # force: true -- see neovim.yml's comment on the same option: the
        # tempfile task above pre-creates dest as an empty file, and without
        # force, get_url's conditional GET against that fresh mtime can get
        # a 304 from GitHub and silently leave a 0-byte file.
        force: true

    - name: Create a temp directory to extract into
      ansible.builtin.tempfile:
        state: directory
        suffix: yazi-extract
      register: _packages_yazi_extract_dir

    - name: Extract the yazi and ya binaries
      ansible.builtin.unarchive:
        src: "{{ _packages_yazi_tmp.path }}"
        dest: "{{ _packages_yazi_extract_dir.path }}"
        remote_src: true
        include:
          - "yazi-{{ _packages_yazi_arch }}-unknown-linux-musl/yazi"
          - "yazi-{{ _packages_yazi_arch }}-unknown-linux-musl/ya"

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Install the yazi and ya binaries
      ansible.builtin.copy:
        src: "{{ _packages_yazi_extract_dir.path }}/yazi-{{ _packages_yazi_arch }}-unknown-linux-musl/{{ item }}"
        dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - yazi
        - ya

    - name: Remove temp download and extraction directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _packages_yazi_tmp.path }}"
        - "{{ _packages_yazi_extract_dir.path }}"
