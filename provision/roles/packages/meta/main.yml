---
galaxy_info:
  role_name: packages
  namespace: dotfiles
  author: dotfiles maintainers
  description: >-
    Install OS packages from the repo's existing manifests (packages/apt.txt,
    packages/Brewfile) plus profile-gated AI CLIs.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: [all]
    - name: Debian
      versions: [all]
    - name: MacOSX
      versions: [all]
    - name: Windows
      versions: [all]

# community.general provides the homebrew* modules (macOS) and the npm
# module (AI CLIs, devcontainer CLI). ansible.windows / community.windows
# provide win_command and win_scoop/win_scoop_bucket (Windows branch, #41).
# All three ship with the `ansible` package (pipx install --include-deps
# ansible); listed here so `ansible-galaxy role install` / lint knows about
# them.
collections:
  - community.general
  - ansible.windows
  - community.windows

dependencies: []
