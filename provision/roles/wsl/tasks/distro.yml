---
# Distro setup: /etc/wsl.conf.
#
# NOT a port of anything in wsl/ -- no legacy script manages this file today
# (wsl/bootstrap.ps1 gets as far as `wsl --install -d Debian` and then the
# username/password first-run wizard; nothing on the Linux side has ever
# touched /etc/wsl.conf). This is new, narrowly-scoped, additive behaviour:
# enable systemd declaratively, the same way the rest of this role manages
# state, instead of leaving "first thing you do on a fresh Debian WSL distro
# is hand-edit /etc/wsl.conf" as tribal knowledge. See defaults/main.yml for
# the wsl_manage_etc_wsl_conf off-switch and wsl_etc_wsl_conf_become's
# become-disabled dry-run knob (mirrors provision/roles/packages's
# packages_apt_become).
#
# community.general.ini_file rather than lineinfile: /etc/wsl.conf is INI,
# not an arbitrary line-oriented file, and ini_file has full check_mode +
# diff support and adds the [boot] section itself if it's missing.

- name: Ensure /etc/wsl.conf enables systemd
  become: "{{ wsl_etc_wsl_conf_become | bool }}"
  community.general.ini_file:
    path: /etc/wsl.conf
    section: boot
    option: systemd
    value: "{{ wsl_systemd_enabled | bool | lower }}"
    mode: "0644"
