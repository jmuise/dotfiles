---
# Ports wsl/migrate-gitconfig-credential.sh: preserve a bare [credential]
# block from ~/.gitconfig by moving it into ~/.gitconfig.local BEFORE
# install.sh (Layer 2) overwrites ~/.gitconfig with its rendered version
# (git/.gitconfig.template + ~/.gitconfig.local merged) -- a bare [credential]
# section only shows up on a machine with a pre-dotfiles ~/.gitconfig,
# because git/.gitconfig.template only ever writes [credential "<url>"]
# *subsections* (see git/.gitconfig.template), never a bare [credential]
# header. This task file must therefore run before install.sh, same
# ordering constraint the original script's docstring calls out -- which
# this role's position in the provisioning chain (Layer 1, before Layer 2 is
# ever wired in; see bootstrap/bootstrap.sh's own docstring) satisfies today
# by construction.
#
# Content-gated (matches ~/.gitconfig.local by content, not existence), same
# reasoning as the bash version: install.sh itself creates a stub
# ~/.gitconfig.local with placeholder user/email if one is absent, so a
# naive existence check would see that stub and skip a real migration if
# this ever ran out of order.
#
# Ported to native modules rather than the original awk/grep/file-append
# pipeline: community.general.git_config_info reads a git config file's
# settings as structured key/value data (no text-block parsing), and
# community.general.git_config writes with full check-mode + diff support --
# confirmed live in a scratch play (ansible-playbook --check --diff against
# a throwaway gitconfig.local) that repeated identical writes report
# changed=false and a --check run leaves the file untouched while still
# reporting the predicted diff.
#
# A bare "[credential]\n\tkey = value" line becomes the flat key
# "credential.<key>" (git lower-cases the key); a *subsectioned* entry like
# "[credential \"https://host\"]\n\tusername = x" becomes
# "credential.https://host.username" -- always with at least one extra '.'
# beyond the first segment, because a bare git-config key name itself can
# never contain a dot (git-config(1): names are alnum + '-'). So
# '^credential\.[^.]+$' selects exactly the bare-section keys and never a
# subsection -- confirmed against a scratch file containing both forms.

- name: Set gitconfig path facts
  ansible.builtin.set_fact:
    wsl_gitconfig_path: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    wsl_gitconfig_local_path: "{{ ansible_facts['env']['HOME'] }}/.gitconfig.local"

- name: Stat ~/.gitconfig
  ansible.builtin.stat:
    path: "{{ wsl_gitconfig_path }}"
  register: _wsl_gitconfig_stat

- name: Migrate the [credential] block, if any
  when: _wsl_gitconfig_stat.stat.exists
  block:
    - name: Read ~/.gitconfig's settings
      community.general.git_config_info:
        scope: file
        path: "{{ wsl_gitconfig_path }}"
      register: _wsl_gitconfig_info

    - name: Select the bare [credential] section's keys (not [credential "url"] subsections)
      ansible.builtin.set_fact:
        wsl_gitconfig_credential_pairs: >-
          {{
            _wsl_gitconfig_info.config_values
            | dict2items
            | selectattr('key', 'match', '^credential\.[^.]+$')
            | list
          }}

    - name: Report when there is nothing to migrate
      ansible.builtin.debug:
        msg: "No bare [credential] block in ~/.gitconfig - nothing to migrate."
      when: wsl_gitconfig_credential_pairs | length == 0

    - name: Read ~/.gitconfig.local's settings (empty/absent file reads as no settings, not an error)
      community.general.git_config_info:
        scope: file
        path: "{{ wsl_gitconfig_local_path }}"
      register: _wsl_gitconfig_local_info

    - name: Decide whether ~/.gitconfig.local was already migrated
      ansible.builtin.set_fact:
        wsl_gitconfig_already_migrated: >-
          {{
            (_wsl_gitconfig_local_info.config_values
             | dict2items
             | selectattr('key', 'match', '^credential\.[^.]+$')
             | list
             | length) > 0
          }}

    - name: Report when already migrated
      ansible.builtin.debug:
        msg: "~/.gitconfig.local already has a [credential] block - skipping (already migrated)."
      when: wsl_gitconfig_already_migrated and wsl_gitconfig_credential_pairs | length > 0

    - name: Migrate the [credential] block into ~/.gitconfig.local
      when: wsl_gitconfig_credential_pairs | length > 0 and not wsl_gitconfig_already_migrated
      block:
        - name: Stat ~/.gitconfig.local (before any write, to decide whether to seed [user])
          ansible.builtin.stat:
            path: "{{ wsl_gitconfig_local_path }}"
          register: _wsl_gitconfig_local_stat_pre

        - name: Search /mnt/c/Users for a Windows-side ~/.gitconfig.local (only when no explicit override is set)
          # ansible.builtin.find, not the fileglob lookup: fileglob skips
          # dotfiles by default and doesn't descend through a wildcard
          # *directory* component (confirmed live -- a
          # '/mnt/c/Users/*/.gitconfig.local' fileglob query came back empty
          # against a real match, while find with hidden:true/recurse:true
          # found it).
          ansible.builtin.find:
            paths: /mnt/c/Users
            patterns: ".gitconfig.local"
            hidden: true
            recurse: true
          register: _wsl_windows_local_find
          when:
            - not _wsl_gitconfig_local_stat_pre.stat.exists
            - wsl_windows_gitconfig_local | length == 0

        - name: Resolve the Windows-side ~/.gitconfig.local (override wins; else single unambiguous /mnt/c/Users match)
          ansible.builtin.set_fact:
            wsl_gitconfig_windows_local_resolved: >-
              {{
                wsl_windows_gitconfig_local
                if (wsl_windows_gitconfig_local | length > 0)
                else (
                  (_wsl_windows_local_find.files | default([]) | length == 1)
                  | ternary(_wsl_windows_local_find.files | default([{'path': ''}]) | map(attribute='path') | list | first, '')
                )
              }}
          when: not _wsl_gitconfig_local_stat_pre.stat.exists

        - name: Seed [user] name/email in a brand-new ~/.gitconfig.local
          when: not _wsl_gitconfig_local_stat_pre.stat.exists
          block:
            - name: Stat the resolved Windows-side ~/.gitconfig.local
              ansible.builtin.stat:
                path: "{{ wsl_gitconfig_windows_local_resolved }}"
              register: _wsl_windows_local_stat
              when: wsl_gitconfig_windows_local_resolved | length > 0

            - name: Read the Windows-side ~/.gitconfig.local's user.name/user.email
              community.general.git_config_info:
                scope: file
                path: "{{ wsl_gitconfig_windows_local_resolved }}"
              register: _wsl_windows_local_info
              when: >-
                wsl_gitconfig_windows_local_resolved | length > 0
                and _wsl_windows_local_stat.stat.exists | default(false)

            - name: Set the seed name/email (Windows-side value, else the same placeholder the bash version used)
              ansible.builtin.set_fact:
                wsl_gitconfig_seed_name: >-
                  {{
                    (_wsl_windows_local_info.config_values['user.name'][0]
                     if (_wsl_windows_local_info is defined and 'user.name' in (_wsl_windows_local_info.config_values | default({})))
                     else 'Your Name')
                  }}
                wsl_gitconfig_seed_email: >-
                  {{
                    (_wsl_windows_local_info.config_values['user.email'][0]
                     if (_wsl_windows_local_info is defined and 'user.email' in (_wsl_windows_local_info.config_values | default({})))
                     else 'you@example.com')
                  }}

            - name: Write the seed user.name
              community.general.git_config:
                name: user.name
                scope: file
                file: "{{ wsl_gitconfig_local_path }}"
                value: "{{ wsl_gitconfig_seed_name }}"

            - name: Write the seed user.email
              community.general.git_config:
                name: user.email
                scope: file
                file: "{{ wsl_gitconfig_local_path }}"
                value: "{{ wsl_gitconfig_seed_email }}"

        - name: Warn when a bare [credential] key has more than one value (only the first is migrated)
          ansible.builtin.debug:
            msg: >-
              ~/.gitconfig's bare [credential] key '{{ item.key }}' has
              {{ item.value | length }} values; only the first
              ('{{ item.value[0] }}') is migrated.
          loop: "{{ wsl_gitconfig_credential_pairs }}"
          loop_control:
            label: "{{ item.key }}"
          when: item.value | length > 1

        - name: Write each bare [credential] key into ~/.gitconfig.local
          community.general.git_config:
            name: "{{ item.key }}"
            scope: file
            file: "{{ wsl_gitconfig_local_path }}"
            value: "{{ item.value[0] }}"
          loop: "{{ wsl_gitconfig_credential_pairs }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Check whether ~/.gitconfig.local now actually exists (the git_config writes above are simulated under --check)
          ansible.builtin.stat:
            path: "{{ wsl_gitconfig_local_path }}"
          register: _wsl_gitconfig_local_stat_post

        - name: Ensure ~/.gitconfig.local is 0600 (it now holds a credential.helper)
          # Skipped under --check on a brand-new file: the git_config writes
          # above only simulate their effect in check mode, so the file
          # doesn't really exist yet for ansible.builtin.file to chmod -
          # confirmed live (a --check run against a fresh ~/.gitconfig.local
          # failed here with "file (...) is absent, cannot continue" before
          # this guard was added). A real run always has the file by this
          # point (git_config actually wrote it), and a --check run against
          # an already-migrated file still runs this and reports no change.
          ansible.builtin.file:
            path: "{{ wsl_gitconfig_local_path }}"
            mode: "0600"
          when: _wsl_gitconfig_local_stat_post.stat.exists or not ansible_check_mode
