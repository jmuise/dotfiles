# starship.toml — cross-shell prompt config
# https://starship.rs/config/
# Works in bash, zsh, and PowerShell

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$python\
$golang\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ── core ──────────────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold blue"
format            = "[$path]($style)[$read_only]($read_only_style) "

[fill]
symbol = " "

# ── git ───────────────────────────────────────────────────────────────────────
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style  = "bold purple"

[git_status]
format    = '([\[$all_status$ahead_behind\]]($style) )'
style     = "bold red"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed   = "$"
modified  = "!"
staged    = "+"
renamed   = "»"
deleted   = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style  = "bold yellow"

# ── runtime versions (shown only when relevant) ───────────────────────────────
[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "

[python]
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
symbol = " "

[golang]
format = "[$symbol($version )]($style)"
symbol = " "

[rust]
format = "[$symbol($version )]($style)"
symbol = " "

[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
style  = "blue bold"

# ── performance info ──────────────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
format   = "[$duration]($style) "
style    = "bold yellow"

# ── system / context ──────────────────────────────────────────────────────────
[os]
disabled = false
format   = "[$symbol]($style) "

[os.symbols]
Macos   = ""
Linux   = ""
Windows = ""
Ubuntu  = ""
Debian  = ""
Alpine  = ""

[username]
show_always = false
format      = "[$user]($style)@"
style_user  = "bold green"

[hostname]
ssh_only = true
format   = "[$hostname]($style) "
style    = "bold green"
