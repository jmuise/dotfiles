gui:
  nerdFontsVersion: "3"
  showIcons: true
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    selectedLineBgColor:
      - blue
  # Wider side panel so branch names don't get truncated
  sidePanelWidth: 0.25

git:
  paging:
    colorArg: always
    # Pipe through delta (same pager as ~/.gitconfig) for consistent diffs
    pager: delta --dark --pager "less -RF"
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"

keybinding:
  universal:
    quit: q
    quit-alt1: <c-c>
    nextTab: "]"
    prevTab: "["

os:
  editPreset: nvim
